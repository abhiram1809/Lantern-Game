<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Green Lantern — Awakening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;500;700;800&family=Noto+Sans+Runic&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>
    <div id="frame"></div>
    <div id="hud">
      <div id="chapter"></div>
      <div id="objective"></div>
      <div id="clock"></div>
    </div>
    <div id="prompt"></div>
    <div id="subtitle"><div class="speaker"></div><div class="text"></div></div>
    <div id="choice"><div class="question"></div><div class="options"></div><div class="keys"></div></div>
    <div id="controls"></div>
    <div id="checkpoint"></div>
    <div id="fade"></div>
    <div id="flash"></div>
    <div id="screen"></div>
    <div id="pause"></div>
    <div id="loading">
      <div class="emblem"></div>
      <div class="label">Charging the lantern…</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
